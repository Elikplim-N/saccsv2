<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Device Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Custom Styles for smooth transitions and better UX -->
  <style>
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-600 to-blue-400 text-white py-6 shadow-md">
    <div class="container mx-auto px-4">
      <h1 class="text-4xl font-bold text-center">IoT Device Dashboard</h1>
      <p class="text-center mt-2">Real-Time Monitoring & Control</p>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <!-- Device Status Section -->
    <section id="deviceStatus" class="mb-8">
      <div class="bg-white rounded-lg shadow-lg p-6 card">
        <h2 class="text-2xl font-semibold border-b pb-2 mb-4">Device Status</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
          <div class="border rounded-lg p-4 text-center">
            <h3 class="font-bold text-xl mb-2">Relay Lamp</h3>
            <p id="relayLamp" class="text-2xl font-medium text-gray-700">Loading...</p>
          </div>
          <div class="border rounded-lg p-4 text-center">
            <h3 class="font-bold text-xl mb-2">Relay Socket</h3>
            <p id="relaySocket" class="text-2xl font-medium text-gray-700">Loading...</p>
          </div>
          <div class="border rounded-lg p-4 text-center">
            <h3 class="font-bold text-xl mb-2">Buzzer</h3>
            <p id="buzzer" class="text-2xl font-medium text-gray-700">Loading...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Access Logs Section -->
    <section id="accessLogs" class="mb-8">
      <div class="bg-white rounded-lg shadow-lg p-6 card">
        <h2 class="text-2xl font-semibold border-b pb-2 mb-4">Access Logs</h2>
        <div class="max-h-80 overflow-y-auto">
          <ul id="logsList" class="space-y-3">
            <li class="text-gray-600">Loading logs...</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Control Device Section -->
    <section id="controlDevice">
      <div class="bg-white rounded-lg shadow-lg p-6 card">
        <h2 class="text-2xl font-semibold border-b pb-2 mb-4">Control Device</h2>
        <form id="controlForm" class="space-y-6">
          <div class="flex items-center space-x-3">
            <input type="checkbox" id="controlRelayLamp" class="h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="controlRelayLamp" class="text-lg font-medium text-gray-700">Relay Socket</label>
          </div>
          <div class="flex items-center space-x-3">
            <input type="checkbox" id="controlRelaySocket" class="h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="controlRelaySocket" class="text-lg font-medium text-gray-700">Relay Lamp</label>
          </div>
          <div class="flex items-center space-x-3">
            <input type="checkbox" id="controlBuzzer" class="h-5 w-5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="controlBuzzer" class="text-lg font-medium text-gray-700">Buzzer</label>
          </div>
          <button type="submit" class="w-full py-3 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition-colors">
            Send Control Command
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 py-4 mt-8">
    <div class="container mx-auto text-center text-gray-600">
      &copy; <span id="currentYear"></span> IoT Dashboard. All rights reserved.
    </div>
  </footer>

  <script>
    // Insert current year in footer
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    // Replace these values with your actual Supabase endpoint and key
    const supabaseUrl = 'https://lhyxuuomjusjmkycuwuh.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoeXh1dW9tanVzam1reWN1d3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEwODc0NjIsImV4cCI6MjA1NjY2MzQ2Mn0.d_Ax_9uf6_yrx6lpwFzptpyL3AfB_VPo-sXEgavje54';

    // Fetch the latest device control status and update the dashboard.
    async function fetchDeviceStatus() {
      try {
        const response = await fetch(supabaseUrl + '/rest/v1/device_control?order=created_at.desc&limit=1', {
          headers: {
            'apikey': supabaseKey,
            'Authorization': 'Bearer ' + supabaseKey
          }
        });
        if (response.ok) {
          const data = await response.json();
          if (data.length > 0) {
            const status = data[0];
            document.getElementById('relaySocket').innerText = status.relay_lamp ? 'OFF' : 'ON';
            document.getElementById('relayLamp').innerText = status.relay_socket ? 'OFF' : 'ON';
            document.getElementById('buzzer').innerText = status.buzzer ? 'ON' : 'OFF';
          }
        } else {
          console.error('Failed to fetch device status');
        }
      } catch (error) {
        console.error('Error fetching device status:', error);
      }
    }

    // Fetch recent access logs and update the logs list.
    async function fetchAccessLogs() {
      try {
        const response = await fetch(supabaseUrl + '/rest/v1/access_logs?order=created_at.desc&limit=10', {
          headers: {
            'apikey': supabaseKey,
            'Authorization': 'Bearer ' + supabaseKey
          }
        });
        if (response.ok) {
          const logs = await response.json();
          const logsList = document.getElementById('logsList');
          logsList.innerHTML = '';
          if (logs.length === 0) {
            logsList.innerHTML = '<li class="text-gray-600">No logs available</li>';
          } else {
            logs.forEach(log => {
              const listItem = document.createElement('li');
              listItem.className = "p-2 bg-gray-100 rounded";
              listItem.innerText = `UID: ${log.uid} - Status: ${log.status} (${new Date(log.created_at).toLocaleString()})`;
              logsList.appendChild(listItem);
            });
          }
        } else {
          console.error('Failed to fetch access logs');
        }
      } catch (error) {
        console.error('Error fetching access logs:', error);
      }
    }

    // Send new device control update to the backend.
    async function sendControlUpdate(event) {
      event.preventDefault();
      const relayLamp = document.getElementById('controlRelayLamp').checked;
      const relaySocket = document.getElementById('controlRelaySocket').checked;
      const buzzer = document.getElementById('controlBuzzer').checked;

      const payload = {
        relay_lamp: relayLamp,
        relay_socket: relaySocket,
        buzzer: buzzer
      };

      try {
        const response = await fetch(supabaseUrl + '/rest/v1/device_control', {
          method: 'POST',
          headers: {
            'apikey': supabaseKey,
            'Authorization': 'Bearer ' + supabaseKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        if (response.ok) {
          alert('Control updated successfully.');
          fetchDeviceStatus();
        } else {
          alert('Failed to update device control.');
        }
      } catch (error) {
        console.error('Error sending control update:', error);
        alert('Error sending control update.');
      }
    }

    document.getElementById('controlForm').addEventListener('submit', sendControlUpdate);

    // Initial fetch and periodic updates
    fetchDeviceStatus();
    fetchAccessLogs();
    setInterval(fetchDeviceStatus, 10000); // refresh device status every 10 seconds
    setInterval(fetchAccessLogs, 15000); // refresh access logs every 15 seconds
  </script>
</body>
</html>
